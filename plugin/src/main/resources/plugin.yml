name: Overseer
version: '${version}'
main: dev.overseersmp.overseer.OverseerPlugin
api-version: '26.2'
description: An AI god rules this world.
authors: [Overseer]
commands:
  pray:
    description: Speak to the Overseer.
    usage: /pray <message>
    permission: overseer.pray
  overseer:
    description: Overseer administration.
    usage: '/overseer <reload|stats|silence|decree|forcedecree [ids]|cleardecree>'
    permission: overseer.admin
  favor:
    description: Show your favor (or another pilgrim's).
    usage: /favor [player]
    permission: overseer.pray
  fame:
    description: 'Let videos show your name (default is off).'
    usage: '/fame on|off'
    permission: overseer.pray
permissions:
  overseer.pray:
    description: Use /pray
    default: true
  overseer.admin:
    description: Administer the Overseer
    default: op
