name: report

# Daily 05:15 Berlin: reports/YYYY-MM-DD.md from what the client API can read, committed to main.
# Two UTC triggers cover summer/winter time; ops/common.gate() lets only the one in Berlin hour 5 proceed.
# SAFETY: no pull_request triggers, so secrets are never exposed to fork PRs.
on:
  schedule:
    - cron: '15 3 * * *'
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the report

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'Mart0034/overseer-smp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ops.txt
      - run: pip install -r requirements-ops.txt
      - name: Generate report
        env:
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_CLIENT_KEY: ${{ secrets.PTERO_CLIENT_KEY }}
        run: python -m ops.report
      - name: Secret scan, then commit
        run: |
          python scripts/secret_scan.py all
          git config user.name "Overseer AI"
          git config user.email "overseer-ai@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily report $(TZ=Europe/Berlin date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
