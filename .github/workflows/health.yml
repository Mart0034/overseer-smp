name: health

# Every 15 minutes: server running? TPS >= 18? RAM < 95 %? Posts to the staff Discord webhook ONLY when the state changes.
# SAFETY: no pull_request triggers, so secrets are never exposed to fork PRs.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panel-ops
  cancel-in-progress: false

jobs:
  health:
    if: github.repository == 'Mart0034/overseer-smp'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ops.txt
      - run: pip install -r requirements-ops.txt
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: health-state.json
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-
      - name: Check
        env:
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_CLIENT_KEY: ${{ secrets.PTERO_CLIENT_KEY }}
          DISCORD_WEBHOOK_STAFF: ${{ secrets.DISCORD_WEBHOOK_STAFF }}
        run: python -m ops.health
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: health-state.json
          key: health-state-${{ github.run_id }}
