name: build

on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write   # create the release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Build jar
        env:
          OVERSEER_VERSION: 0.1.${{ github.run_number }}
        run: ./gradlew build --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" "build/libs/Overseer-0.1.${{ github.run_number }}.jar" \
            --target "${{ github.sha }}" --title "Overseer 0.1.${{ github.run_number }}" \
            --notes "Automated build of ${{ github.sha }}. Tests passed."
